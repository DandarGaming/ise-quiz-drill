# Source of truth for repository labels. The labels workflow syncs this file
# to GitHub on every push to main, so edit labels here, not in the web UI.
# Every issue and pull request gets one type, at least one area and one priority.

# Type: what kind of change this is (matches the Conventional Commits prefix)
- name: 'type: feat'
  color: '#1d76db'
  description: 'New feature'
- name: 'type: fix'
  color: '#1d76db'
  description: 'Bug fix'
- name: 'type: docs'
  color: '#1d76db'
  description: 'Documentation, ADRs and product specs'
- name: 'type: test'
  color: '#1d76db'
  description: 'Adding or fixing tests'
- name: 'type: refactor'
  color: '#1d76db'
  description: 'Code change that does not change behaviour'
- name: 'type: build'
  color: '#1d76db'
  description: 'Build system, dependencies setup, Docker, CDK'
- name: 'type: ci'
  color: '#1d76db'
  description: 'CI/CD workflows and pipeline config'
- name: 'type: chore'
  color: '#1d76db'
  description: 'Maintenance and repo housekeeping'

# Area: which part of the product it touches
- name: 'area: quiz-taking'
  color: '#0e8a16'
  description: 'Quiz attempt UI, navigation, timer and refresh resilience'
- name: 'area: results'
  color: '#0e8a16'
  description: 'Scoring, results and answer review'
- name: 'area: creator'
  color: '#0e8a16'
  description: 'Mock test creation, prompt builder and JSON import'
- name: 'area: history'
  color: '#0e8a16'
  description: 'Saved tests and past attempts'
- name: 'area: a11y'
  color: '#0e8a16'
  description: 'Accessibility of the app UI'
- name: 'area: infra'
  color: '#0e8a16'
  description: 'AWS, CDK, Docker and deployment'

# Priority: how soon it should be done (red to pale, most to least urgent)
- name: 'priority: high'
  color: '#b60205'
  description: 'Do this first, blocks other work'
- name: 'priority: medium'
  color: '#fbca04'
  description: 'Planned for the current milestone'
- name: 'priority: low'
  color: '#c2e0c6'
  description: 'Nice to have'

# Status: only states the board cannot show
- name: 'status: blocked'
  color: '#6a737d'
  description: 'Waiting on something outside this ticket'

# Dependabot defaults, kept so its pull requests can still be filtered
- name: 'dependencies'
  color: '#0366d6'
  description: 'Pull requests that update a dependency file'
- name: 'javascript'
  color: '#168700'
  description: 'Pull requests that update javascript code'
- name: 'github_actions'
  color: '#000000'
  description: 'Pull requests that update GitHub Actions code'

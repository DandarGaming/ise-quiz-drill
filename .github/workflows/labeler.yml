name: Pull Request Labeler

# pull_request_target runs with the base branch config and a write token, so
# Dependabot pull requests get labelled too. It never checks out PR code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Label from branch name and changed paths
        uses: actions/labeler@v7

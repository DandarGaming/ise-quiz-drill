name: Deploy Static Site via AWS CDK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # On main, deploy only after every test layer has passed
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      - name: Install CDK Dependencies
        run: cd cdk && npm ci

      - name: Test CDK Stacks
        run: cd cdk && npm test

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Validate CDK Template (Pull Request Dry-run)
        if: github.event_name == 'pull_request'
        run: cd cdk && npx cdk synth -c apiOrigin=api.example.com

      - name: Resolve the server API origin
        id: api-origin
        if: github.event_name == 'push'
        run: |
          for attempt in $(seq 1 90); do
            URL=$(aws cloudformation describe-stacks \
              --stack-name ServiceStack \
              --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue | [0]" \
              --output text 2>/dev/null || true)
            if [[ "$URL" == https://* ]]; then
              echo "host=${URL#https://}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "The ECS service URL was not available after 15 minutes." >&2
          exit 1

      - name: Deploy Infrastructure (Merged Main Execution)
        if: github.event_name == 'push'
        run: cd cdk && npx cdk deploy CdkStack -c apiOrigin="${{ steps.api-origin.outputs.host }}" --require-approval never --outputs-file cdk-outputs.json

      - name: Smoke Test Deployed Site
        if: github.event_name == 'push'
        run: |
          URL=$(jq -r '.[].SiteUrl' cdk/cdk-outputs.json)
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$URL/"
          curl -fsS "$URL/" | grep -q "<title>Quiz Drill</title>"

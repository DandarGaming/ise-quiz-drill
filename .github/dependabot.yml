version: 2
updates:
  # Check Astro package.json
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # One PR a week for everything that should not break the build
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # @astrojs/check only supports TypeScript 5 and 6
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Check CDK package.json
  - package-ecosystem: 'npm'
    directory: '/cdk'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Bump Node type majors together with the Node runtime, not on their own
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Check Github Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

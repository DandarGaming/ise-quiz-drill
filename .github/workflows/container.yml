name: Container Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: 468204079455.dkr.ecr.eu-west-1.amazonaws.com
  REPOSITORY: ise-quiz-drill

jobs:
  # On main, push an image only after every test layer has passed
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The default OCI format drops HEALTHCHECK; Docker format keeps it
      - name: Build image with Podman
        run: podman build --format docker -t "$REPOSITORY:$GITHUB_SHA" .

      - name: Smoke test the container
        run: |
          podman run -d --name app -p 4321:4321 "$REPOSITORY:$GITHUB_SHA"
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://localhost:4321/api/health
          curl -fsS http://localhost:4321/ | grep -q "<title>Quiz Drill</title>"

      - name: Show container logs
        if: failure()
        run: podman logs app

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        run: aws ecr get-login-password | podman login --username AWS --password-stdin "$REGISTRY"

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          for tag in "${GITHUB_SHA::7}" latest; do
            podman push "$REPOSITORY:$GITHUB_SHA" "$REGISTRY/$REPOSITORY:$tag"
          done

  # Roll the ECS Express service onto the image just pushed (ADR-007)
  deploy:
    needs: image
    if: ${{ !cancelled() && github.event_name == 'push' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    # A second merge waits for the running deploy instead of cancelling it mid-rollout
    concurrency:
      group: deploy-service
      cancel-in-progress: false
    # GitHub links this URL under Deployments on the repo page and the run
    environment:
      name: production
      url: ${{ steps.service.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # The CDK app also defines the static site stack, which needs the build output
      - name: Build the site for CDK synth
        run: npm ci && npm run build

      - name: Install CDK dependencies
        run: cd cdk && npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      # The alarm email is a secret so the address stays out of the public repo
      - name: Deploy the service
        env:
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
        run: cd cdk && npx cdk deploy ServiceStack -c imageTag="${GITHUB_SHA::7}" -c alarmEmail="$ALARM_EMAIL" --require-approval never --outputs-file cdk-outputs.json

      - name: Smoke test the service
        id: service
        run: |
          URL=$(jq -r '.ServiceStack.ServiceUrl' cdk/cdk-outputs.json)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_SHA::7} to $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$URL/api/health"
          curl -fsS "$URL/" | grep -q "<title>Quiz Drill</title>"
